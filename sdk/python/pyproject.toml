[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "revkit"
# revkit.__version__, which scripts/version.sh keeps equal to ../../VERSION.
dynamic = ["version"]
description = "Python SDK for the revkit reverse-engineering API (gRPC)"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The committed stubs were generated by grpcio-tools 1.84 (protobuf 7.36
# gencode), which check for at least these runtimes at import time.
dependencies = ["grpcio>=1.84", "protobuf>=7.36"]

[project.optional-dependencies]
dev = ["grpcio-tools==1.84.0", "pytest>=8"]
mcp = ["mcp>=1.10"]

[project.scripts]
revkit-mcp = "revkit.mcp_cli:main"
revkit-ghidra-import = "revkit.ghidra.importer:main"
revkit-ghidra-export = "revkit.ghidra.exporter:main"
rk-script = "revkit.script.cli:main"

[tool.setuptools.dynamic]
version = {attr = "revkit.__version__"}

[tool.setuptools.packages.find]
include = ["revkit*"]

[tool.setuptools.package-data]
# The starter scripts (rk-script list) ship as files in the package.
"revkit.scripts" = ["*.py"]
# The agent workflow guide the MCP server serves (prompt "investigate",
# resource revkit://guide; docs/api.md MCP server).
"revkit" = ["agent_guide.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
