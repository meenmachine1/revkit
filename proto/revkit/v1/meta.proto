// Server identity and capability discovery. The first call a client makes.
syntax = "proto3";

package revkit.v1;

option cc_enable_arenas = true;
option go_package = "revkit.dev/api/revkit/v1;revkitv1";
option java_multiple_files = true;
option java_package = "dev.revkit.api.v1";

// Server identity, API version and optional features.
service MetaService {
  // Describes the server: API version, optional features and limits.
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);
  // Restarts the daemon (api_minor 55, feature "daemon-restart", which the
  // daemon lists only when it can): it answers, then shuts down gracefully
  // (projects saved, workers and script hosts stopped, streams ended) and
  // runs itself again with the same command line and environment, or,
  // started by systemd socket activation, exits for systemd to start it on
  // the next connection. Admins only; logged with the caller. Every client
  // loses its connection and streams for the moment it takes.
  rpc RestartDaemon(RestartDaemonRequest) returns (RestartDaemonResponse);
}

message RestartDaemonRequest {
  // Only say what a restart would do (mode, open_streams); nothing restarts.
  bool dry_run = 1;
  // Why, for the daemon's log ("from the web UI").
  string reason = 2;
}

message RestartDaemonResponse {
  // "reexec": the daemon runs itself again in the same process (same PID,
  // command line and environment); "exit": it exits and systemd starts it
  // again on the next connection to its socket (socket activation).
  string mode = 1;
  // Live update streams open now (SubscriptionService.Subscribe), the
  // caller's own included: each web UI tab holds one, as do agents that
  // follow changes. A restart ends them; clients reconnect.
  uint32 open_streams = 2;
}

message GetServerInfoRequest {
  // Client name and version, e.g. "revkit-py/0.1.0". Logged; never used to
  // change behaviour.
  string client = 1;
}

message GetServerInfoResponse {
  // Protobuf package major version served, "v1". Breaking changes ship as a
  // new package (revkit.v2) served side by side.
  string api_major = 1;
  // Schema minor revision within the major version. Increments whenever
  // fields, RPCs or enum values are added (see docs/api.md, "Versioning").
  // A client that needs a feature added in minor N checks api_minor >= N or,
  // preferably, the named feature flag.
  uint32 api_minor = 2;
  // Daemon build, e.g. "rk-daemon 0.1.0 (git abc1234)".
  string server_version = 3;
  // Optional capabilities, by stable name. Examples: "decompile",
  // "snapshot-reads", "import-bytes", "fake-backend". Clients must
  // ignore names they do not know.
  repeated string features = 4;
  // How many past revisions per project the server keeps readable.
  uint32 retained_revisions = 5;
  // Largest request message accepted, in bytes (e.g. for ImportProgram
  // with inline content).
  uint64 max_request_bytes = 6;
  // Seconds since the daemon started serving (api_minor 36, feature
  // "daemon-info", added by the transport).
  uint64 uptime_seconds = 7;
  // The daemon's command line (argv, the program first), so a client can
  // say how to start it again. Only for admins (and with --no-auth): it
  // names host paths. Empty for anyone else (api_minor 36).
  repeated string launch_args = 8;
  // The HTTP listener came from the service manager (systemd socket
  // activation, docs/packaging.md): connecting to it starts the daemon
  // again after it stops (api_minor 36).
  bool socket_activated = 9;
}
