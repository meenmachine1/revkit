// Authentication and authorization (api_minor 13, feature "auth"). See
// docs/security.md for the threat model and setup.
//
// Every call names its caller with `authorization: Bearer <token>`
// metadata (native clients), or, through the daemon's HTTP gateway, with
// the HttpOnly session cookie that Login sets plus an `x-csrf-token`
// header (browsers). The token is a session token from Login or an API
// token from CreateToken / `rk-daemon token create`. Unauthenticated calls
// fail with UNAUTHENTICATED, calls beyond the caller's role or project
// list with PERMISSION_DENIED.
//
// The server stamps the caller's identity on what it writes: a user's
// edits carry provenance user:<account>, an API token's agent:<token name>
// (or user:<account> for a token issued to a user). A request whose
// provenance names someone else is refused (PERMISSION_DENIED); leave kind
// and id empty to have the server fill them in.
//
// A daemon started with --no-auth (loopback only) accepts every call as
// an anonymous admin and stamps nothing; WhoAmI then reports
// auth_enabled = false.
syntax = "proto3";

package revkit.v1;

import "google/protobuf/timestamp.proto";
import "revkit/v1/common.proto";

option cc_enable_arenas = true;
option go_package = "revkit.dev/api/revkit/v1;revkitv1";
option java_multiple_files = true;
option java_package = "dev.revkit.api.v1";

// Sessions, identity, and the management of accounts and API tokens.
service AuthService {
  // Exchanges an account's name and password for a session token.
  // Needs no credentials. Failed attempts are rate limited per client
  // address and per account name: RESOURCE_EXHAUSTED until the delay in
  // the message has passed.
  rpc Login(LoginRequest) returns (LoginResponse);
  // Ends the caller's session (the bearer session token, or the cookie's).
  // A no-op for API tokens: revoke those with RevokeToken.
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Who the caller is. Needs no credentials: an unauthenticated caller gets
  // auth_enabled = true and no identity, which is how a UI decides to show
  // its login page.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // Changes the caller's own password (sessions only); ends the account's
  // other sessions.
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);

  // Accounts (admin).
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Changes an account's role, password or projects; a new role or password
  // ends its sessions.
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Deletes an account with its sessions and the API tokens issued to it.
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);

  // API tokens for scripts, agents and peer daemons (admin).
  rpc ListTokens(ListTokensRequest) returns (ListTokensResponse);
  // Issues a token. Its secret is returned once and never stored (the
  // daemon keeps a SHA-256 of it).
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
}

// What a caller may do. Each role includes the ones before it, except PEER.
enum Role {
  ROLE_UNSPECIFIED = 0;
  // Reads: listings, decompilation, history, subscriptions, presence.
  ROLE_VIEWER = 1;
  // Also edits: assertions, retractions, reverts, command plugins, analysis.
  ROLE_EDITOR = 2;
  // Also imports, host-file browsing, closing projects, accounts and tokens.
  ROLE_ADMIN = 3;
  // Another daemon: SyncService only (replication of every project).
  ROLE_PEER = 4;
}

enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  // A local account, by session or by a token issued to the account.
  PRINCIPAL_KIND_USER = 1;
  // An API token not issued to an account: a script or an agent.
  PRINCIPAL_KIND_AGENT = 2;
  // A peer daemon (a ROLE_PEER token or the shared peer secret).
  PRINCIPAL_KIND_PEER = 3;
  // Authentication is disabled (--no-auth).
  PRINCIPAL_KIND_ANONYMOUS = 4;
}

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED = 0;
  // --no-auth: nothing was checked.
  AUTH_METHOD_NONE = 1;
  // A session token from Login (bearer or cookie).
  AUTH_METHOD_SESSION = 2;
  // An API token.
  AUTH_METHOD_TOKEN = 3;
  // The shared peer secret (--peer-secret-file).
  AUTH_METHOD_PEER_SECRET = 4;
}

// An authenticated caller.
message Identity {
  PrincipalKind kind = 1;
  // Account name, token name, or peer name.
  string name = 2;
  Role role = 3;
  // Projects the caller may use; empty means every project.
  repeated string projects = 4;
  AuthMethod method = 5;
  // The provenance the server stamps on this caller's edits (kind and id).
  Provenance provenance = 6;
  // When the session or token expires; unset if it does not.
  google.protobuf.Timestamp expires_at = 7;
}

message LoginRequest {
  string username = 1;
  string password = 2;
  // For browsers, through the HTTP gateway: the gateway keeps the session
  // in an HttpOnly, SameSite=Strict cookie (Secure over TLS) and leaves
  // LoginResponse.token empty, so page scripts never see it. Every later
  // cookie-authenticated call must send csrf_token as the x-csrf-token
  // header. Ignored over native gRPC.
  bool session_cookie = 3;
  // Free-form client label, for the daemon's log ("rk-web/0.1").
  string client = 4;
}

message LoginResponse {
  // Opaque session token for `authorization: Bearer <token>`. Empty when
  // the gateway set a session cookie instead.
  string token = 1;
  google.protobuf.Timestamp expires_at = 2;
  Identity identity = 3;
  // The session's CSRF token, for cookie-authenticated browser calls.
  string csrf_token = 4;
}

message LogoutRequest {}

message LogoutResponse {}

message WhoAmIRequest {}

message WhoAmIResponse {
  // False when the daemon runs with --no-auth.
  bool auth_enabled = 1;
  // Unset when the caller sent no valid credentials.
  Identity identity = 2;
  // The session's CSRF token when the caller authenticated with a session
  // (how a reloaded page that only has its cookie recovers it).
  string csrf_token = 3;
}

message ChangePasswordRequest {
  string old_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

// A local account.
message User {
  // Letters, digits, '.', '_', '-' and '@'; 1 to 64 characters.
  string name = 1;
  Role role = 2;
  // Projects the account may use; empty means every project.
  repeated string projects = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated User users = 1;
}

message CreateUserRequest {
  string name = 1;
  // VIEWER, EDITOR or ADMIN.
  Role role = 2;
  // At least 8 characters.
  string password = 3;
  repeated string projects = 4;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string name = 1;
  // UNSPECIFIED keeps the role.
  Role role = 2;
  // Empty keeps the password.
  string password = 3;
  // Replace the project list with `projects` (empty: every project).
  bool set_projects = 4;
  repeated string projects = 5;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string name = 1;
}

message DeleteUserResponse {}

// An API token's description (never its secret).
message ApiToken {
  // Public identifier, also embedded in the secret ("rkt_<id>_...").
  string id = 1;
  // Its edits are stamped agent:<name> (unless issued to a user).
  string name = 2;
  Role role = 3;
  // When set, the token acts as this account: user:<user> provenance, and
  // never more than the account's role and projects.
  string user = 4;
  repeated string projects = 5;
  google.protobuf.Timestamp created_at = 6;
  // Unset: never expires.
  google.protobuf.Timestamp expires_at = 7;
}

message ListTokensRequest {}

message ListTokensResponse {
  repeated ApiToken tokens = 1;
}

message CreateTokenRequest {
  string name = 1;
  Role role = 2;
  string user = 3;
  repeated string projects = 4;
  // Lifetime in seconds; 0 means it never expires.
  uint64 ttl_seconds = 5;
}

message CreateTokenResponse {
  ApiToken token = 1;
  // The bearer secret. Shown once.
  string secret = 2;
}

message RevokeTokenRequest {
  // The token's id, or its name.
  string id = 1;
}

message RevokeTokenResponse {}
