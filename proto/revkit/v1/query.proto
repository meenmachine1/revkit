// Read-only queries over one program. Every request takes ReadOptions (snapshot
// pinning) and every response carries the Snapshot it was computed at.
syntax = "proto3";

package revkit.v1;

import "revkit/v1/assertion.proto";
import "revkit/v1/common.proto";
import "revkit/v1/decompile.proto";
import "revkit/v1/listing.proto";
import "revkit/v1/project.proto";
import "revkit/v1/types.proto";

option cc_enable_arenas = true;
option go_package = "revkit.dev/api/revkit/v1;revkitv1";
option java_multiple_files = true;
option java_package = "dev.revkit.api.v1";

// Read-only, snapshot-consistent queries over one program.
service QueryService {
  // Memory blocks in address order.
  rpc GetMemoryMap(GetMemoryMapRequest) returns (GetMemoryMapResponse);
  // Raw bytes. Stops early at uninitialized memory.
  rpc ReadMemory(ReadMemoryRequest) returns (ReadMemoryResponse);
  // Functions, paginated (page_size default 500, max 5000).
  rpc ListFunctions(ListFunctionsRequest) returns (ListFunctionsResponse);
  // Functions and labels by effective name, in address order (page_size
  // default 500, max 5000). Added in api_minor 2 (feature "symbols").
  rpc ListSymbols(ListSymbolsRequest) returns (ListSymbolsResponse);
  // Ghidra's symbol tree, one level at a time: Imports (by library),
  // Exports, Functions, Labels, Classes and Namespaces (api_minor 82,
  // feature "symbol-tree").
  rpc ListSymbolTree(ListSymbolTreeRequest) returns (ListSymbolTreeResponse);
  // Ghidra's Clear Flow and Repair, planned: the code the flow from an
  // instruction reaches that nothing else reaches, as the ClearCode edits
  // that clear it (api_minor 83, feature "clear-flow"). Writes nothing: a
  // client asserts the edits (in one AppendAssertions, one undo step).
  rpc PlanClearFlow(PlanClearFlowRequest) returns (PlanClearFlowResponse);
  // The function at an entry point, or containing an address.
  rpc GetFunction(GetFunctionRequest) returns (GetFunctionResponse);
  // A page of listing rows, by row window or address window (max 2000 rows).
  rpc GetListing(GetListingRequest) returns (GetListingResponse);
  // One instruction decoded in full, with p-code.
  rpc GetInstruction(GetInstructionRequest) returns (GetInstructionResponse);
  // References to and/or from an address or range (page_size default 500).
  rpc GetXrefs(GetXrefsRequest) returns (GetXrefsResponse);
  // References back from a library (api_minor 81, feature
  // "library-importers"): the programs of the project whose imports resolve
  // to this program (ProjectService.ListProgramLibraries' resolution), each
  // import that does, and the importer's references to its thunk and slot.
  rpc ListLibraryImporters(ListLibraryImportersRequest) returns (ListLibraryImportersResponse);
  // Decompiles one function into a mapped token stream.
  rpc Decompile(DecompileRequest) returns (DecompileResponse);
  // Def-use chains and data-flow slices in a function's decompilation
  // (api_minor 57, feature "decompile-slices"; Ghidra's Highlight Def-use,
  // Forward and Backward Slice and the instruction slices): the tokens and
  // instruction addresses a varnode reaches, or is reached from.
  rpc SliceDecompiled(SliceDecompiledRequest) returns (SliceDecompiledResponse);
  // Type definitions by content hash.
  rpc GetTypes(GetTypesRequest) returns (GetTypesResponse);
  // Type search by name: the program's named types (structs, unions, enums,
  // typedefs) from debug info, DefineType assertions and the library
  // archive applied to its imports. Implemented by the image backend since
  // api_minor 11 (feature "find-types"); earlier ones returned nothing.
  rpc FindTypes(FindTypesRequest) returns (FindTypesResponse);
  // A function's basic blocks with their instructions, and the control-flow
  // edges between them (api_minor 11, feature "function-graph").
  rpc GetFunctionGraph(GetFunctionGraphRequest) returns (GetFunctionGraphResponse);
  // The program's defined data: strings, pointers, accessed undefinedN and
  // asserted global types, with values and reference counts (page_size
  // default 500, max 5000; api_minor 11, feature "data-list").
  rpc ListData(ListDataRequest) returns (ListDataResponse);
  // Every comment of the program, by address, with its kind, function and
  // who wrote it (api_minor 77, feature "comment-table"; Ghidra's comment
  // window).
  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse);
  // Register values over address ranges, per register: the user's
  // (SetRegisterValue) and analysis's (the loader's MIPS gp, PowerPC TOC
  // and small data bases), as analysis and the decompiler take them
  // (api_minor 87, feature "register-values"; Ghidra's register manager).
  rpc ListRegisterValues(ListRegisterValuesRequest) returns (ListRegisterValuesResponse);
  // The relocations the file carries (Ghidra's relocation table), by
  // address: ELF dynamic and object relocations, PE base relocations
  // (api_minor 78, feature "relocation-table").
  rpc ListRelocations(ListRelocationsRequest) returns (ListRelocationsResponse);
  // C++ classes from MSVC run-time type information (api_minor 45,
  // feature "msvc-rtti"; docs/pe.md): every class a TypeDescriptor names,
  // its bases (from its ClassHierarchyDescriptor) and derived classes, its
  // vftables with their functions, and the struct `this` points to in
  // virtual methods. Empty for a program without MSVC RTTI.
  rpc GetClassHierarchy(GetClassHierarchyRequest) returns (GetClassHierarchyResponse);

  // The calling conventions a function of the program can have (api_minor
  // 58, feature "calling-conventions"): the compiler spec's prototype
  // models and aliases (Ghidra's Edit Function dropdown), the spec's
  // default, and how C spells each for a prototype's declaration.
  rpc ListCallingConventions(ListCallingConventionsRequest) returns (ListCallingConventionsResponse);

  // Batch reads for scripts (api_minor 29, feature "script-batch";
  // docs/scripting.md).
  //
  // Decompiles many functions, or every function, at one revision and
  // streams each result as it completes: functions whose decompilation is
  // already memoized first, the rest scheduled over the daemon's decompiler
  // workers (rk-decompd), so results arrive in completion order (each
  // carries its request index). The revision is pinned for the whole run:
  // ReadOptions.revision (an expired one fails at once with
  // REVISION_EXPIRED, and a client may rerun at head), else the head when
  // the call starts. A function that fails to decompile is a result with
  // `failure`, as for Decompile; an entry with no function is a result with
  // `error`. Cancelling the call stops the work not yet started.
  rpc DecompileMany(DecompileManyRequest) returns (stream DecompileManyResponse);
  // Ghidra's C/C++ exporter: functions decompiled into one .c file and,
  // when asked, a .h of the program's types and the functions' prototypes
  // (api_minor 80, feature "export-c"). Progress messages while the
  // functions decompile, then the files in parts.
  rpc ExportC(ExportCRequest) returns (stream ExportCResponse);
  // Finds a byte pattern, with an optional bit mask, in the program's
  // initialized memory (as patched), in address order.
  rpc FindBytes(FindBytesRequest) returns (FindBytesResponse);
  // The instructions in a range or a function's body, decoded in full with
  // their p-code (as GetInstruction returns each), streamed in address
  // order in batches.
  rpc ListInstructions(ListInstructionsRequest) returns (stream ListInstructionsResponse);

  // The byte viewer's read (api_minor 44, feature "byte-viewer"): the bytes
  // of a range as patched, what the listing makes of each one (a run per
  // instruction or data item, undefined and uninitialized bytes coalesced)
  // and the file's bytes where a patch changed them. At most 64 KiB.
  rpc GetByteView(GetByteViewRequest) returns (GetByteViewResponse);
  // The program's overview (api_minor 44, feature "overview"): its memory
  // blocks cut into about `buckets` slices, each with how many of its bytes
  // are code, data, undefined, external or uninitialized, and its entropy.
  // For the bars beside the listing's scrollbar; cheap (it samples bytes).
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // The next or previous place of a kind from an address (api_minor 44,
  // feature "find-next"): an instruction, data or undefined bytes (the next
  // run of them, as Ghidra's Next Instruction), a label, a function, a byte
  // that differs from the one at the address, or a note.
  rpc FindNext(FindNextRequest) returns (FindNextResponse);
  // Searches (api_minor 41, feature "search"; docs/api.md "Search"). Each
  // streams batches of matches in address order (backward from `start`
  // with `backward`), with progress, and ends with a message that has
  // `done` set. Cancelling the call stops the search.
  //
  // Memory: bytes the user describes as hex with wildcards, a string in
  // an encoding, numbers, binary with masks or a regular expression over
  // bytes, in the program's initialized memory as patched (Ghidra's Search
  // Memory).
  rpc SearchMemory(SearchMemoryRequest) returns (stream SearchMemoryResponse);
  // Program text: comments, labels, function signatures, instructions and
  // defined data as the listing shows them (renames included), as plain
  // text or a regular expression (Ghidra's Search Program Text).
  rpc SearchText(SearchTextRequest) returns (stream SearchTextResponse);
  // Instructions and defined data that use a scalar value, or one in a
  // range (Ghidra's Search for Scalars).
  rpc SearchScalars(SearchScalarsRequest) returns (stream SearchScalarsResponse);
  // Decompiled C of every function or some, over DecompileMany's workers
  // and memo (Ghidra's Decompiler Text Finder).
  rpc SearchDecompiled(SearchDecompiledRequest) returns (stream SearchDecompiledResponse);

  // Where a struct or union, or one of its fields, is used (api_minor 53,
  // feature "type-uses"; Ghidra's Find Uses of): the decompiled C of every
  // function or some, over DecompileMany's workers and memo, read for
  // FIELD tokens of the type (with the field's offset) and TYPE tokens
  // naming it (declarations and casts). Streams batches of uses with
  // progress, as SearchDecompiled does, and ends with a message that has
  // `done` set. Cancelling the call stops the work not yet started.
  rpc FindTypeUses(FindTypeUsesRequest) returns (stream FindTypeUsesResponse);
}

message GetMemoryMapRequest {
  string program_id = 1;
  ReadOptions read = 2;
}

message GetMemoryMapResponse {
  Snapshot snapshot = 1;
  // In address order: the image's blocks (as edited) and the regions the
  // user added (api_minor 24, feature "memory-map").
  repeated MemoryBlock blocks = 2;
  // Regions the user added that the map can't place, with the reason
  // (MemoryBlock.rejected): one that overlaps another after concurrent
  // edits or an undo. Not mapped; remove or move them.
  repeated MemoryBlock rejected = 3;
}

message ReadMemoryRequest {
  string program_id = 1;
  Address address = 2;
  // At most 1 MiB.
  uint32 length = 3;
  ReadOptions read = 4;
}

message ReadMemoryResponse {
  Snapshot snapshot = 1;
  Address address = 2;
  // May be shorter than requested: reads stop at the first byte that is not
  // initialized memory.
  bytes data = 3;
}

message ListFunctionsRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // Case-insensitive substring match on the effective name.
  string name_contains = 4;
  // Only functions whose entry falls in this range.
  AddressRange range = 5;
  FunctionSort sort = 6;
  // Skip this many matches, for random access by position (a virtualized
  // list scrolled to the middle). Only with an empty page_token; pin
  // read.revision to keep positions stable across calls. Feature
  // `function-list-offset`.
  uint64 offset = 7;
  // Reverse the sort (api_minor 19, feature "function-list-filters").
  bool descending = 8;
  // Filters (api_minor 19, feature "function-list-filters"); unset keeps
  // every function.
  FunctionNameFilter named = 9;
  FunctionThunkFilter thunks = 10;
  // Only functions the decompiler is known to fail on
  // (Function.decompile_failed).
  bool decompile_failed = 11;
}

// Functions by how they are named (ListFunctionsRequest.named).
enum FunctionNameFilter {
  FUNCTION_NAME_FILTER_UNSPECIFIED = 0;  // every function
  // A name from a symbol, an export, debug info, a thunk's target or an
  // assertion.
  FUNCTION_NAME_FILTER_NAMED = 1;
  // Only the default FUN_<address>.
  FUNCTION_NAME_FILTER_UNNAMED = 2;
}

enum FunctionThunkFilter {
  FUNCTION_THUNK_FILTER_UNSPECIFIED = 0;  // every function
  FUNCTION_THUNK_FILTER_ONLY = 1;
  FUNCTION_THUNK_FILTER_EXCLUDE = 2;
}

message ListFunctionsResponse {
  Snapshot snapshot = 1;
  repeated Function functions = 2;
  PageInfo page = 3;
}

message ListSymbolsRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // Case-insensitive substring match on the effective name; empty matches
  // every symbol.
  string name_contains = 4;
  // Exact, case-sensitive match on the effective name. When set,
  // name_contains is ignored.
  string name_equals = 5;
  // Only these kinds (empty = all).
  repeated SymbolKind kinds = 6;
  // Only symbols whose address falls in this range.
  AddressRange range = 7;
}

message ListSymbolsResponse {
  Snapshot snapshot = 1;
  // Address order; at most one symbol per address (its primary name).
  repeated Symbol symbols = 2;
  PageInfo page = 3;
}

message ListSymbolTreeRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // The node whose children to list: empty for the root (its folders),
  // ["Imports"] (libraries), ["Imports", <library>], ["Exports"],
  // ["Functions"], ["Labels"], ["Classes"] (every class by its qualified
  // name), ["Classes", <qualified class>, <inner>...], ["Namespaces",
  // <namespace>, <inner>...].
  repeated string path = 4;
  // Only children whose name or qualified name holds this
  // (case-insensitive; not at the root).
  string name_contains = 5;
}

enum SymbolTreeNodeKind {
  SYMBOL_TREE_NODE_KIND_UNSPECIFIED = 0;
  // One of the root's folders.
  SYMBOL_TREE_NODE_KIND_FOLDER = 1;
  // An imported library (Imports; "<EXTERNAL>" when the file doesn't say
  // which).
  SYMBOL_TREE_NODE_KIND_LIBRARY = 2;
  SYMBOL_TREE_NODE_KIND_NAMESPACE = 3;
  SYMBOL_TREE_NODE_KIND_CLASS = 4;
  SYMBOL_TREE_NODE_KIND_FUNCTION = 5;
  SYMBOL_TREE_NODE_KIND_LABEL = 6;
  // An imported function or object: its thunk, else its slot.
  SYMBOL_TREE_NODE_KIND_IMPORT = 7;
  SYMBOL_TREE_NODE_KIND_EXPORT = 8;
}

message SymbolTreeNode {
  // As the tree shows it: a symbol's name within its namespace or class,
  // a class's qualified name in Classes.
  string name = 1;
  SymbolTreeNodeKind kind = 2;
  // A symbol's address (unset for folders, libraries and scopes).
  Address address = 3;
  // The qualified name: a symbol's effective name, a scope's path.
  string full_name = 4;
  // What it holds, for folders, libraries and scopes.
  uint64 children = 5;
  // An import's library.
  string library = 6;
}

message ListSymbolTreeResponse {
  Snapshot snapshot = 1;
  // Scopes and libraries first, then by name in any case.
  repeated SymbolTreeNode nodes = 2;
  PageInfo page = 3;
  uint64 total = 4;
}

message PlanClearFlowRequest {
  string program_id = 1;
  ReadOptions read = 2;
  // An instruction: where the flow starts.
  Address address = 3;
  // Also the code of the functions it calls that nothing else calls
  // (Ghidra's option to clear called functions).
  bool follow_calls = 4;
}

message ClearFlowRange {
  Address address = 1;
  uint64 length = 2;
}

message PlanClearFlowResponse {
  Snapshot snapshot = 1;
  // The ranges to clear, by address, merged where they touch: a
  // ListingEdit ClearCode of each clears the flow.
  repeated ClearFlowRange ranges = 2;
  // Instructions the flow reaches, and of those the ones that stay because
  // code outside the flow reaches them too (the repair: they stay code).
  uint32 instructions = 3;
  uint32 kept = 4;
  // Functions whose entry is cleared: they go with it.
  repeated Address functions = 5;
}

message GetFunctionRequest {
  string program_id = 1;
  Address address = 2;
  // False: address must be an entry point. True: return the function whose
  // body contains address. NOT_FOUND when there is none.
  bool containing = 3;
  ReadOptions read = 4;
}

message GetFunctionResponse {
  Snapshot snapshot = 1;
  Function function = 2;
}

message GetListingRequest {
  string program_id = 1;
  ReadOptions read = 2;
  oneof window {
    RowWindow rows = 3;
    AddressWindow addresses = 4;
  }
  // Skip raw bytes in rows (saves bandwidth for clients that hide them).
  bool omit_bytes = 5;
  // Also return header rows (LISTING_ROW_KIND_HEADER) above code units:
  // plate comments, function signatures, labels and pre-comments, as
  // Ghidra's listing shows them. Row numbers, first_row and total_rows are
  // then in that numbering, and so are the windows to apply from
  // InvalidatedQuery.header_rows. Address windows anchor on the code unit
  // containing start, with its header rows counting toward rows_before.
  // Feature `listing-header-rows`.
  bool header_rows = 6;
}

message GetListingResponse {
  Snapshot snapshot = 1;
  repeated ListingRow rows = 2;
  // Row number of rows[0] (or of where it would be, when empty).
  int64 first_row = 3;
  // Rows in the whole listing at this revision, for scrollbar sizing.
  int64 total_rows = 4;
  // The window was cut short by the row cap.
  bool truncated = 5;
}

message GetInstructionRequest {
  string program_id = 1;
  Address address = 2;
  ReadOptions read = 3;
}

message GetInstructionResponse {
  Snapshot snapshot = 1;
  InstructionDetail instruction = 2;
}

message GetXrefsRequest {
  string program_id = 1;
  oneof location {
    Address address = 2;
    // All references into or out of any address in the range (e.g. a
    // function body).
    AddressRange range = 3;
  }
  XrefDirection direction = 4;
  // Only these kinds (empty = all).
  repeated XrefKind kinds = 5;
  ReadOptions read = 6;
  PageRequest page = 7;
}

message GetXrefsResponse {
  Snapshot snapshot = 1;
  // Sorted by (direction, from_address, to_address).
  repeated Xref xrefs = 2;
  PageInfo page = 3;
}

message ListLibraryImportersRequest {
  // The library program.
  string program_id = 1;
  // One export: the function at or containing the address, or the name
  // ("free@GLIBC_2.2.5" is "free"). Neither: every import of the library.
  oneof target {
    Address address = 2;
    string name = 3;
  }
  // Also the importers' references to each import: to its thunk, and to
  // its slot other than the thunk's own jump through it.
  bool include_references = 4;
  // At most this many references per import (0: 50; at most 1000).
  uint32 max_references = 5;
  // The library's read (the importers are read at their head).
  ReadOptions read = 6;
}

// One program's import of the library.
message LibraryImporter {
  string program_id = 1;
  string program_name = 2;
  // The name it needs the library by (its DT_NEEDED or DLL name).
  string library = 3;
  // The import in the importer (name, thunk, slot), and where it goes in the
  // library (address, function_name).
  ResolvedImport resolved = 4;
  // include_references: in the importer, by address.
  repeated Xref references = 5;
  // More than max_references.
  bool references_truncated = 6;
}

message ListLibraryImportersResponse {
  Snapshot snapshot = 1;
  // By importer name, then in the importer's slot order.
  repeated LibraryImporter importers = 2;
}

message DecompileRequest {
  string program_id = 1;
  // Entry point of the function.
  Address function = 2;
  ReadOptions read = 3;
  DecompileOptions options = 4;
}

message DecompileResponse {
  Snapshot snapshot = 1;
  DecompiledFunction function = 2;
  // Set when the decompiler failed (api_minor 8, feature
  // "decompile-failures"): `function` then holds only its entry, name and an
  // error line.
  DecompileFailure failure = 3;
}

enum SliceKind {
  SLICE_KIND_UNSPECIFIED = 0;
  // The varnode's definition and its uses: the tokens that print it.
  SLICE_KIND_DEF_USE = 1;
  // Every value computed from it, transitively (Ghidra's Forward Slice).
  SLICE_KIND_FORWARD = 2;
  // Every value it is computed from, transitively (Backward Slice).
  SLICE_KIND_BACKWARD = 3;
  // The ops the forward slice runs through (Forward Inst Slice): the
  // tokens printed from them.
  SLICE_KIND_FORWARD_OPS = 4;
  // The ops the backward slice runs through (Backward Inst Slice).
  SLICE_KIND_BACKWARD_OPS = 5;
}

// A token of a DecompiledFunction: its line and its index in the line.
message TokenPosition {
  uint32 line = 1;
  uint32 token = 2;
}

message SliceDecompiledRequest {
  string program_id = 1;
  // Entry point of the function.
  Address function = 2;
  ReadOptions read = 3;
  SliceKind kind = 4;
  // Where the slice starts: a token of the decompilation as Decompile
  // returns it at this revision (its varnodes, or the op it was printed
  // from: the op's output forward, its inputs backward), a varnode
  // (DecompiledFunction.varnodes), or a variable (every varnode of it).
  oneof from {
    TokenPosition token = 5;
    uint32 varnode_index = 6;
    uint32 variable_index = 7;
  }
}

message SliceDecompiledResponse {
  Snapshot snapshot = 1;
  // The tokens in the slice, in reading order.
  repeated TokenPosition tokens = 2;
  // The instructions the slice's ops belong to, ascending (what the
  // listing marks).
  repeated Address addresses = 3;
  // The slice's varnodes that tokens print (DecompiledFunction.varnodes).
  repeated uint32 varnode_indices = 4;
  // What it started from, for a caption ("uVar1", "the output of INT_ADD").
  string start = 5;
}

message GetTypesRequest {
  string program_id = 1;
  repeated string hashes = 2;
  // Also return every type the requested ones reference, transitively.
  bool include_dependencies = 3;
}

message GetTypesResponse {
  // Types are immutable by hash; the snapshot is informational.
  Snapshot snapshot = 1;
  repeated TypeDefinition types = 2;
  // Requested hashes the server does not know.
  repeated string missing = 3;
}

message FindTypesRequest {
  string program_id = 1;
  // Case-insensitive substring of the type name; empty matches all named
  // types.
  string name_contains = 2;
  repeated TypeKind kinds = 3;
  ReadOptions read = 4;
  // page_size default 500, max 5000. Results are by name, then hash.
  PageRequest page = 5;
  // Also return definitions superseded by a BindTypeName of their name
  // (TypeDefinition.superseded), for a type's history (api_minor 11).
  bool include_superseded = 6;
  // Only types from these sources (empty = all; api_minor 11).
  repeated TypeSource sources = 7;
  // Case-insensitive prefix of the name (with name_contains, both apply),
  // e.g. one namespace ("std::") or one initial letter of a category tree
  // (api_minor 19, feature "find-types-tree").
  string name_prefix = 8;
  // Only the summary of each type: hash, name, kind, size, display,
  // origin, bound and superseded, without fields, enumerators or the C
  // definition; for listing many (api_minor 19).
  bool summary_only = 9;
  // Only types filed under this category ("/net"): in it or a category
  // below it (api_minor 35, feature "type-archive"). "/" is the top, with
  // every type under it.
  string category = 10;
  // With category: only the types directly in it, not below ("/": the
  // types with no category).
  bool category_exact = 11;
  // Also return every category the program files a type under (with the
  // other filters but `category`), for a folder tree.
  bool include_categories = 12;
  // Only enums with a member of this value, compared at the enum's width
  // (Set Equate's suggestions; api_minor 39, feature "equates").
  optional int64 enum_value = 13;
}

// A category and how many named types are filed directly in it.
message TypeCategory {
  string path = 1;
  uint32 types = 2;
}

// Where a named type comes from.
enum TypeSource {
  TYPE_SOURCE_UNSPECIFIED = 0;
  // Defined in the program: debug info (DWARF, PDB) or DefineType.
  TYPE_SOURCE_PROGRAM = 1;
  // The library type archives applied to the program's imports
  // (origin.derived.rule "library:<archive>").
  TYPE_SOURCE_LIBRARY = 2;
  // Defined at project scope: visible to every program of the project
  // (TypeDefinition.project; api_minor 52, feature "project-types").
  TYPE_SOURCE_PROJECT = 3;
}

message FindTypesResponse {
  Snapshot snapshot = 1;
  repeated TypeDefinition types = 2;
  PageInfo page = 3;
  // With include_categories: every category path, sorted; the top ("/")
  // counts the types with no category (api_minor 35).
  repeated TypeCategory categories = 4;
}

// ---------------------------------------------------------------------------
// Function graphs (api_minor 11, feature "function-graph")
// ---------------------------------------------------------------------------

message GetFunctionGraphRequest {
  string program_id = 1;
  // The function's entry, or with `containing` any address in its body.
  Address function = 2;
  bool containing = 3;
  ReadOptions read = 4;
  // Skip raw bytes in the blocks' rows.
  bool omit_bytes = 5;
}

// How control leaves a block for another block of the same function.
enum FlowEdgeKind {
  FLOW_EDGE_KIND_UNSPECIFIED = 0;
  // Into the next block without a jump (the block ends at a jump target).
  FLOW_EDGE_KIND_FALL_THROUGH = 1;
  // A conditional branch, taken.
  FLOW_EDGE_KIND_CONDITIONAL_TRUE = 2;
  // A conditional branch, not taken (its fallthrough).
  FLOW_EDGE_KIND_CONDITIONAL_FALSE = 3;
  // An unconditional jump.
  FLOW_EDGE_KIND_UNCONDITIONAL = 4;
  // A computed jump's case (a recovered jump table).
  FLOW_EDGE_KIND_SWITCH = 5;
}

message FlowEdge {
  // Indexes into GetFunctionGraphResponse.blocks.
  uint32 from_block = 1;
  uint32 to_block = 2;
  FlowEdgeKind kind = 3;
}

message BasicBlock {
  // First and last byte of its instructions.
  AddressRange range = 1;
  // Its instructions as listing rows (kind INSTRUCTION, with tokens, flow,
  // flow targets, labels and comments; `row` is the index in the block).
  repeated ListingRow rows = 2;
  // Control leaves the function here (a return, a tail call or jump out,
  // a no-return call or a halt).
  bool exit = 3;
}

message GetFunctionGraphResponse {
  Snapshot snapshot = 1;
  Function function = 2;
  // In address order; the entry's block is blocks[entry_block]. A block
  // ends at a branch, jump, return or computed jump, or before a jump
  // target; calls don't end blocks.
  repeated BasicBlock blocks = 3;
  uint32 entry_block = 4;
  repeated FlowEdge edges = 5;
  // Cut at 50,000 instructions.
  bool truncated = 6;
}

// ---------------------------------------------------------------------------
// Defined data (api_minor 11, feature "data-list")
// ---------------------------------------------------------------------------

enum DataCategory {
  DATA_CATEGORY_UNSPECIFIED = 0;
  // string, unicode, unicode32.
  DATA_CATEGORY_STRING = 1;
  DATA_CATEGORY_POINTER = 2;
  // undefinedN that code accesses.
  DATA_CATEGORY_UNDEFINED = 3;
  // A global whose type is asserted (Retype on an address that isn't a
  // function).
  DATA_CATEGORY_TYPED = 4;
  // Data a user defined from the listing other than strings and pointers
  // (ListingEdit.data: integers, floats, structs, arrays; api_minor 30).
  DATA_CATEGORY_DEFINED = 5;
}

message DefinedData {
  Address address = 1;
  uint32 length = 2;
  DataCategory category = 3;
  // "string", "unicode", "pointer", "undefined4", or the asserted type.
  string data_type = 4;
  // Strings: the characters (UTF-8, without quotes or terminator).
  // Pointers: the target's name or address. Others: as the listing shows it.
  string value = 5;
  // Pointers: the address held.
  Address target = 6;
  // The effective name at the address ("s_hello_00402000"), if any.
  string label = 7;
  uint32 xref_to_count = 8;
  // Where the type came from: derived (data analysis) or the assertion.
  FactOrigin origin = 9;
}

message ListDataRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // Only these categories (empty = all).
  repeated DataCategory categories = 4;
  // Case-insensitive substring of the value, the label or the type.
  string text_contains = 5;
  // Only data starting in this range.
  AddressRange range = 6;
  // Skip this many matches (random access; only with an empty page_token).
  uint64 offset = 7;
}

message ListDataResponse {
  Snapshot snapshot = 1;
  // Address order.
  repeated DefinedData data = 2;
  PageInfo page = 3;
}

message ListCommentsRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // Only these kinds (empty: all).
  repeated CommentKind kinds = 4;
  // Only comments whose text holds this (case-insensitive).
  string text_contains = 5;
  AddressRange range = 6;
}

message ProgramComment {
  Address address = 1;
  CommentKind kind = 2;
  string text = 3;
  // The function the address is in, and its name.
  Address function = 4;
  string function_name = 5;
  // The address's own label, if any.
  string label = 6;
  // Who wrote it.
  FactOrigin origin = 7;
}

message ListCommentsResponse {
  Snapshot snapshot = 1;
  // Address order, then kind.
  repeated ProgramComment comments = 2;
  PageInfo page = 3;
  uint64 total = 4;
}

message ListRelocationsRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  AddressRange range = 4;
  // Only relocations whose symbol or type name holds this
  // (case-insensitive).
  string text_contains = 5;
}

// What a relocation does, for the types revkit tells apart; the rest are
// OTHER (type and type_name always say which).
enum RelocationKind {
  RELOCATION_KIND_UNSPECIFIED = 0;
  RELOCATION_KIND_OTHER = 1;
  // Load base + addend (R_*_RELATIVE).
  RELOCATION_KIND_RELATIVE = 2;
  // The result of calling the resolver at base + addend (R_*_IRELATIVE).
  RELOCATION_KIND_IRELATIVE = 3;
  // A PLT's GOT slot for the symbol (R_*_JUMP_SLOT).
  RELOCATION_KIND_JUMP_SLOT = 4;
  // A GOT slot holding the symbol's address (R_*_GLOB_DAT).
  RELOCATION_KIND_GLOB_DAT = 5;
  // Symbol + addend, or for PE a link-time address moved by the load delta
  // (R_X86_64_64, IMAGE_REL_BASED_DIR64, ...).
  RELOCATION_KIND_ABSOLUTE = 6;
}

message ProgramRelocation {
  // The location patched.
  Address address = 1;
  // The raw type as in the file (ELF r_type, PE IMAGE_REL_BASED_*).
  uint32 type = 2;
  // "R_X86_64_JUMP_SLOT", "IMAGE_REL_BASED_DIR64"; "type N" when revkit has
  // no name for it.
  string type_name = 3;
  RelocationKind kind = 4;
  // Empty when it has no symbol.
  string symbol = 5;
  // Explicit for RELA; for REL, RELR and PE, the word stored at address.
  int64 addend = 6;
  // Where it points once applied, when that doesn't depend on another
  // module: RELATIVE, IRELATIVE (the resolver) and PE base relocations
  // (unset otherwise).
  Address target = 7;
  // The bytes at address as loaded, a pointer's worth: the file's, except
  // that a rebase (SetImageBase) applies the RELATIVE ones.
  bytes original = 8;
  // The function or label the target is, if any.
  string target_name = 9;
}

message ListRelocationsResponse {
  Snapshot snapshot = 1;
  // Address order.
  repeated ProgramRelocation relocations = 2;
  PageInfo page = 3;
  // After the filters.
  uint64 total = 4;
  // "elf", "pe" or "raw": what the relocations are read from.
  string format = 5;
}

message ListRegisterValuesRequest {
  string program_id = 1;
  ReadOptions read = 2;
  PageRequest page = 3;
  // Only this register (by name, case ignored); empty: all.
  string register_name = 4;
  // Only ranges overlapping this one.
  AddressRange range = 5;
}

message RegisterValueRange {
  string register_name = 1;
  // Where the register holds the value (inclusive).
  AddressRange range = 2;
  uint64 value = 3;
  // Who set it: the winning assertion (a SetRegisterValue), or analysis
  // (derived, rule "analysis.register_values:<origin>": "mips-gp",
  // "ppc64-toc", "ppc64-opd", "ppc-sda", "ppc-sda2").
  FactOrigin origin = 4;
  // The assertion's key (FACT_KIND_REGISTER_VALUE) when one set it; unset
  // for analysis's. Its range may be larger: this is the part it still
  // holds.
  FactKey key = 5;
}

message RegisterDescription {
  string name = 1;
  uint32 size = 2;  // bytes
}

message ListRegisterValuesResponse {
  Snapshot snapshot = 1;
  // By register name, then address.
  repeated RegisterValueRange ranges = 2;
  PageInfo page = 3;
  uint64 total = 4;
  // The registers values may be set on: the language's, without context
  // registers and those wider than 8 bytes, by storage.
  repeated RegisterDescription registers = 5;
}

message GetClassHierarchyRequest {
  string program_id = 1;
  ReadOptions read = 2;
  // Case-insensitive substring of the class's name; empty: every class.
  string name_contains = 3;
}

// A base class, as the class's BaseClassArray lists it (RTTI's
// BaseClassDescriptor).
message RttiBase {
  string name = 1;
  Address type_descriptor = 2;
  // A direct base (else a base of a base).
  bool direct = 3;
  bool is_virtual = 4;
  // Where the base's subobject is (PMD.mdisp); for a virtual base, inside
  // the base its vbtable locates.
  int32 offset = 5;
  // The vbtable pointer's offset (PMD.pdisp; -1: not virtual) and the
  // base's index in that vbtable (PMD.vdisp).
  int32 vbtable_offset = 6;
  int32 vbtable_index = 7;
  uint32 attributes = 8;  // BaseClassDescriptor.attributes
  uint32 depth = 9;       // 1: direct
  Address base_descriptor = 10;  // the BaseClassDescriptor
}

message RttiVirtualFunction {
  uint32 slot = 1;
  Address entry = 2;
  // The function's effective name (a rename, the debug info's, the
  // analysis's ClassName::vfuncN).
  string name = 3;
}

message RttiVftable {
  Address address = 1;  // its first entry
  string name = 2;      // effective: "geo::Rect::vftable", "..._for_Named"
  // The subobject it belongs to: its offset in the class and its class
  // ("" for the class itself).
  uint32 offset = 3;
  string subobject = 4;
  Address locator = 5;  // its CompleteObjectLocator
  repeated RttiVirtualFunction functions = 6;
}

message RttiClass {
  string name = 1;     // "geo::Rect"
  string mangled = 2;  // ".?AVRect@geo@@"
  bool is_struct = 3;  // declared struct (".?AU") rather than class
  Address type_descriptor = 4;
  Address hierarchy = 5;  // its ClassHierarchyDescriptor; unset if none was found
  // ClassHierarchyDescriptor.attributes: 1 multiple, 2 virtual inheritance.
  uint32 hierarchy_attributes = 6;
  repeated RttiBase bases = 7;  // preorder, as the BaseClassArray
  // Classes that list this one among their bases, directly.
  repeated string derived = 8;
  repeated RttiVftable vftables = 9;
  // The struct virtual methods' `this` points to ("class geo::Rect"), and
  // its hash where the program defines it.
  string type_name = 10;
  string type_hash = 11;
}

message GetClassHierarchyResponse {
  Snapshot snapshot = 1;
  // By name.
  repeated RttiClass classes = 2;
}

message DecompileManyRequest {
  string program_id = 1;
  // Entry points to decompile, in any order (duplicates are decompiled
  // once each time they appear). Empty with `all`: every function.
  repeated Address functions = 2;
  bool all = 3;
  // revision 0 pins the head at the start of the call.
  ReadOptions read = 4;
  // include_text and timeout_ms as for Decompile; escalate and
  // include_bundle are not taken (INVALID_ARGUMENT): retry one function
  // with Decompile.
  DecompileOptions options = 5;
  // Decompilations in flight at once: 0 = the daemon's decompiler workers
  // plus one; at most 64. The workers are shared, so a larger number only
  // queues.
  uint32 parallelism = 6;
}

message DecompileManyResponse {
  // The revision every result of the call is at (same on every message).
  Snapshot snapshot = 1;
  // Position in the request's `functions`, or in address order with `all`.
  uint32 index = 2;
  // How many results the call will send in all.
  uint32 total = 3;
  Address entry = 4;
  // As DecompileResponse.function and .failure.
  DecompiledFunction function = 5;
  DecompileFailure failure = 6;
  // Set instead of `function` when there is nothing to decompile there
  // ("no function at 0x401000").
  string error = 7;
  // This daemon had served the function's decompilation before the call
  // (so it is probably memoized and came first; it may still rerun if its
  // inputs changed since).
  bool served_before = 8;
  // Wall time from the call's start to this result, and spent on this
  // function alone (milliseconds).
  double elapsed_ms = 9;
  double function_ms = 10;
}

message ExportCRequest {
  string program_id = 1;
  ReadOptions read = 2;
  // Entry points to export, in any order; empty with `all`: every function.
  repeated Address functions = 3;
  bool all = 4;
  // Also a header (<name>.h): Ghidra's built-in type names, every named
  // type of the program (as ExportTypeArchive with TYPE_ARCHIVE_SCOPE_ALL
  // writes them) and a prototype of each function exported; the source
  // then includes it.
  bool header = 5;
  // The files are <name>.c and <name>.h. Default: the program's name.
  string name = 6;
  // As DecompileOptions.timeout_ms, per function.
  uint32 timeout_ms = 7;
  // As DecompileManyRequest.parallelism.
  uint32 parallelism = 8;
}

message ExportCResponse {
  // The revision the export is at (same on every message).
  Snapshot snapshot = 1;
  // Functions decompiled so far, of `total`.
  uint32 done = 2;
  uint32 total = 3;
  // Once the functions are decompiled: the file names, then the header (in
  // one message, when asked for) and the source in parts (in order: their
  // concatenation is the file), the last message with `finished`.
  string source_name = 4;
  string header_name = 5;
  string header = 6;
  string source_part = 7;
  bool finished = 8;
  // On the finished message: the functions in the source, and the ones
  // the decompiler failed on (a comment in the source says why).
  uint32 functions = 9;
  repeated Address failed = 10;
  // Notes on the header (types it can't reproduce: ExportTypeArchive's).
  repeated string notes = 11;
}

message FindBytesRequest {
  string program_id = 1;
  // 1 to 256 bytes.
  bytes pattern = 2;
  // Empty: every bit of `pattern` must match. Else as long as `pattern`;
  // a match needs (memory & mask) == (pattern & mask) byte by byte.
  bytes mask = 3;
  // Only matches starting in this range (unset: the whole program).
  AddressRange range = 4;
  // At most this many matches (0 = 1000; at most 100,000). `truncated`
  // says there were more: search again from the last match + 1.
  uint32 max_results = 5;
  // Only matches at multiples of this (0 or 1: any address).
  uint32 alignment = 6;
  ReadOptions read = 7;
  // Only in executable blocks.
  bool executable_only = 8;
}

message FindBytesResponse {
  Snapshot snapshot = 1;
  // In address order.
  repeated Address addresses = 2;
  bool truncated = 3;
  // Bytes searched.
  uint64 bytes_searched = 4;
}

message ListInstructionsRequest {
  string program_id = 1;
  oneof scope {
    // The instructions starting in this range, in address order.
    AddressRange range = 2;
    // The instructions of the function with this entry (its body).
    Address function = 3;
  }
  ReadOptions read = 4;
  // Leave out each instruction's p-code (smaller and faster).
  bool omit_pcode = 5;
  // Stop after this many instructions (0 = no limit); `truncated` on the
  // last message says there were more.
  uint32 limit = 6;
}

message ListInstructionsResponse {
  Snapshot snapshot = 1;
  // As GetInstruction returns each one.
  repeated InstructionDetail instructions = 2;
  bool truncated = 3;
}

// ---------------------------------------------------------------------------
// Byte viewer, overview and navigation (api_minor 44)
// ---------------------------------------------------------------------------

// What the listing makes of a byte (GetByteView, GetOverview).
enum ByteKind {
  BYTE_KIND_UNSPECIFIED = 0;
  // An instruction's byte.
  BYTE_KIND_CODE = 1;
  // A defined data item's byte (analysis's or the user's).
  BYTE_KIND_DATA = 2;
  // Initialized bytes nothing defines.
  BYTE_KIND_UNDEFINED = 3;
  // An import: a slot the program loads an imported address from, or a
  // stub (PLT, IAT thunk) that jumps through one.
  BYTE_KIND_EXTERNAL = 4;
  // No bytes: zero-fill (.bss) or a reserved region.
  BYTE_KIND_UNINITIALIZED = 5;
}

message GetByteViewRequest {
  string program_id = 1;
  ReadOptions read = 2;
  Address address = 3;
  // At most 65536.
  uint32 length = 4;
}

// A run of bytes of one kind: one instruction or data item, or a stretch
// of undefined or uninitialized bytes.
message ByteRun {
  Address start = 1;
  uint32 length = 2;
  ByteKind kind = 3;
}

// Bytes a patch changed, with what the file had.
message PatchedBytes {
  Address start = 1;
  bytes original = 2;
}

message GetByteViewResponse {
  Snapshot snapshot = 1;
  Address address = 2;
  // As patched, as long as asked (up to the top of the address space); the
  // bytes of uninitialized memory and of addresses outside every block are
  // zero (their runs say BYTE_KIND_UNINITIALIZED).
  bytes data = 3;
  // In address order, covering [address, address + len(data)). The first
  // may start before `address` and the last end after the range (a code
  // unit it cuts).
  repeated ByteRun runs = 4;
  // In address order: where the bytes differ from the file's.
  repeated PatchedBytes patched = 5;
}

message GetOverviewRequest {
  string program_id = 1;
  ReadOptions read = 2;
  // About this many slices (0 = 512; at most 8192). Every block gets at
  // least one, so a program with many blocks may get more.
  uint32 buckets = 3;
}

message OverviewBucket {
  // Inside one memory block.
  Address start = 1;
  uint64 length = 2;
  // The kind most of its bytes are.
  ByteKind kind = 3;
  // Bytes of each kind (they add up to `length`).
  uint64 code = 4;
  uint64 data = 5;
  uint64 undefined = 6;
  uint64 external = 7;
  uint64 uninitialized = 8;
  // Shannon entropy of its bytes (as patched), in bits per byte (0 to 8),
  // over a sample when the slice is large; 0 for uninitialized memory.
  float entropy = 9;
  // The block's name.
  string block = 10;
}

message GetOverviewResponse {
  Snapshot snapshot = 1;
  // In address order.
  repeated OverviewBucket buckets = 2;
  // Bytes in every block.
  uint64 total_bytes = 3;
}

// What FindNext looks for.
enum NavigationKind {
  NAVIGATION_KIND_UNSPECIFIED = 0;
  // The next run of instructions (forward: the first instruction after the
  // run at `from`; backward: the last one before it).
  NAVIGATION_KIND_INSTRUCTION = 1;
  // The same for defined data, and for undefined bytes.
  NAVIGATION_KIND_DATA = 2;
  NAVIGATION_KIND_UNDEFINED = 3;
  // The next (previous) address with a name, a function entry among them.
  NAVIGATION_KIND_LABEL = 4;
  // The next (previous) function entry.
  NAVIGATION_KIND_FUNCTION = 5;
  // The next (previous) initialized byte whose value differs from the one
  // at `from` (as patched).
  NAVIGATION_KIND_DIFFERENT_BYTE = 6;
  // The next (previous) address with a note (Ghidra's bookmarks).
  NAVIGATION_KIND_NOTE = 7;
}

message FindNextRequest {
  string program_id = 1;
  ReadOptions read = 2;
  Address from = 3;
  NavigationKind kind = 4;
  // Look at lower addresses.
  bool backward = 5;
}

message FindNextResponse {
  Snapshot snapshot = 1;
  // Unset when there is none.
  Address address = 2;
  bool found = 3;
}

// ---------------------------------------------------------------------------
// Search (api_minor 41, feature "search")
// ---------------------------------------------------------------------------

// How SearchMemoryRequest.query is read.
enum SearchFormat {
  // HEX.
  SEARCH_FORMAT_UNSPECIFIED = 0;
  // Hex bytes: "48 8b ?? e8", "488b05", nibble wildcards "4? ?f"; "?" and
  // "." are wildcards. Spaces are optional between whole bytes.
  SEARCH_FORMAT_HEX = 1;
  // Text in `encoding`, matched case-insensitively for ASCII letters
  // unless `case_sensitive`; with `escape_sequences`, \n \t \r \0 \\ \"
  // \xHH and \uHHHH are read as such.
  SEARCH_FORMAT_STRING = 2;
  // Whitespace-separated integers (decimal, or 0x hex, optionally
  // negative), each `value_size` bytes in `byte_order`.
  SEARCH_FORMAT_DECIMAL = 3;
  // Whitespace-separated numbers as 4-byte IEEE floats.
  SEARCH_FORMAT_FLOAT = 4;
  // As 8-byte IEEE doubles.
  SEARCH_FORMAT_DOUBLE = 5;
  // Bytes as 8 binary digits each, "0", "1", or "x"/"?"/"." for a bit
  // that may be either: "10xx0101 11110000". Spaces are optional.
  SEARCH_FORMAT_BINARY = 6;
  // A regular expression over bytes (RE2 syntax in Latin-1: "." is any
  // byte but \n, \xHH is a byte, (?s) lets "." match \n too). Matches
  // are leftmost-first and at most 4096 bytes long; no backreferences or
  // lookaround.
  SEARCH_FORMAT_REGEX = 7;
}

enum SearchEncoding {
  // ASCII (bytes as typed; non-ASCII characters as UTF-8).
  SEARCH_ENCODING_UNSPECIFIED = 0;
  SEARCH_ENCODING_ASCII = 1;
  SEARCH_ENCODING_UTF8 = 2;
  // UTF-16 in `byte_order`.
  SEARCH_ENCODING_UTF16 = 3;
}

// Where a search looks. Unset: the whole program.
message SearchScope {
  // Only these ranges (a selection). Empty: everywhere.
  repeated AddressRange ranges = 1;
  // Which code units a match may start in (Ghidra's "Code Units"
  // options): instructions, defined data, undefined bytes. All false:
  // any. Memory and scalar searches only.
  bool instructions = 2;
  bool defined_data = 3;
  bool undefined = 4;
  // Only executable memory blocks (memory search).
  bool executable_only = 5;
}

// Where an incremental search (Next, Previous) starts, and which way it
// goes. Unset: from the start of the program, forward.
message SearchStart {
  // Matches strictly after this address (strictly before with
  // `backward`).
  Address from = 1;
  bool backward = 2;
  // Having reached the end (the start with `backward`) go on from the
  // other end up to `from`; matches found so are marked `wrapped`.
  bool wrap = 3;
}

message SearchMemoryRequest {
  string program_id = 1;
  ReadOptions read = 2;
  SearchFormat format = 3;
  // What to find, as the user typed it (see SearchFormat).
  string query = 4;
  // STRING: the encoding, case and escapes.
  SearchEncoding encoding = 5;
  bool case_sensitive = 6;
  bool escape_sequences = 7;
  // DECIMAL: bytes per value (1, 2, 4 or 8; 0 = 4) and whether values are
  // unsigned (they must fit the size either way).
  uint32 value_size = 8;
  bool unsigned_values = 9;
  // DECIMAL, FLOAT, DOUBLE and UTF16: unspecified is the program's.
  Endianness byte_order = 10;
  SearchScope scope = 11;
  // Only matches at multiples of this (0 or 1: any address).
  uint32 alignment = 12;
  SearchStart start = 13;
  // At most this many matches (0 = 1000; at most 100,000); `truncated` on
  // the last message says there were more.
  uint32 max_results = 14;
  // Fill MemoryMatch.label, .preview and .function (what a results table
  // shows); off, matches carry the address and bytes only.
  bool details = 15;
}

message MemoryMatch {
  Address address = 1;
  // The bytes matched (as patched).
  bytes bytes = 2;
  // With details: the symbol at the address ("" if none), the code unit
  // containing it as the listing shows it ("MOV EAX,0x10", "ds \"usage\"",
  // "undefined1 ??"), its start, and the containing function.
  string label = 3;
  string preview = 4;
  Address code_unit = 5;
  Address function = 6;
  string function_name = 7;
  // Found after wrapping around (SearchStart.wrap).
  bool wrapped = 8;
}

message SearchMemoryResponse {
  // The revision the whole search is at (same on every message).
  Snapshot snapshot = 1;
  repeated MemoryMatch matches = 2;
  // Progress: bytes looked at so far, of all the search will look at.
  uint64 bytes_searched = 3;
  uint64 bytes_total = 4;
  // The last message.
  bool done = 5;
  // There were more than max_results.
  bool truncated = 6;
  // On the first message: the bytes searched for, in hex with "?" for
  // masked nibbles ("48 8b ?? e8"); for a regex, the regex. Binary masks
  // that split a nibble show as "[mask]".
  string pattern = 7;
  // How long the search took (on the last message), milliseconds.
  double elapsed_ms = 8;
}

// What the listing shows that SearchText can match.
enum TextField {
  TEXT_FIELD_UNSPECIFIED = 0;
  // Comments of every kind (plate, pre, end-of-line, post, repeatable),
  // line by line.
  TEXT_FIELD_COMMENTS = 1;
  // Labels: the symbol at an address, default names (FUN_, LAB_, DAT_)
  // included.
  TEXT_FIELD_LABELS = 2;
  // Function signatures, as the listing's header shows them.
  TEXT_FIELD_FUNCTIONS = 3;
  // Instruction mnemonics.
  TEXT_FIELD_MNEMONICS = 4;
  // Instruction operands, as shown (an address shows as its symbol).
  TEXT_FIELD_OPERANDS = 5;
  // Defined data's mnemonic ("ds", "addr", "dword").
  TEXT_FIELD_DATA_MNEMONICS = 6;
  // Defined data's value ("\"usage\"", a pointer's symbol).
  TEXT_FIELD_DATA_VALUES = 7;
}

message SearchTextRequest {
  string program_id = 1;
  ReadOptions read = 2;
  string query = 3;
  // `query` is a regular expression (RE2 syntax over UTF-8).
  bool regex = 4;
  bool case_sensitive = 5;
  // Only matches that are whole words (not inside a longer identifier).
  bool whole_word = 6;
  // Which fields; empty: all of them. With both MNEMONICS and OPERANDS an
  // instruction is matched as one line ("MOV EAX,0x10").
  repeated TextField fields = 7;
  // Ranges only (code-unit options are ignored).
  SearchScope scope = 8;
  SearchStart start = 9;
  // As SearchMemoryRequest.max_results.
  uint32 max_results = 10;
}

message TextMatch {
  Address address = 1;
  TextField field = 2;
  // The field's text as shown (one line of a comment; a whole instruction
  // when MNEMONICS and OPERANDS are both searched) and the first match in
  // it: byte offset and length in the UTF-8 text.
  string text = 3;
  uint32 match_start = 4;
  uint32 match_length = 5;
  // COMMENTS: which comment.
  CommentKind comment_kind = 6;
  // The symbol at the address, and the containing function.
  string label = 7;
  Address function = 8;
  string function_name = 9;
  bool wrapped = 10;
}

message SearchTextResponse {
  Snapshot snapshot = 1;
  repeated TextMatch matches = 2;
  // Progress: listing rows (code units) looked at, of all.
  uint64 rows_searched = 3;
  uint64 rows_total = 4;
  bool done = 5;
  bool truncated = 6;
  double elapsed_ms = 7;
}

message SearchScalarsRequest {
  string program_id = 1;
  ReadOptions read = 2;
  // The values wanted: a scalar matches when its value read as signed
  // (sign-extended from its width) or as unsigned lies in [min, max].
  // Unset bounds are open: neither set finds every scalar.
  optional int64 min = 3;
  optional int64 max = 4;
  // Instructions, defined data or both (SearchScope.instructions and
  // defined_data; neither set: both), in ranges.
  SearchScope scope = 5;
  SearchStart start = 6;
  // As SearchMemoryRequest.max_results.
  uint32 max_results = 7;
}

message ScalarMatch {
  Address address = 1;
  // The value, sign-extended from `bits`, and as unsigned.
  int64 value = 2;
  uint64 unsigned_value = 3;
  // Its width in bits (0 when the disassembler didn't say).
  uint32 bits = 4;
  // The operand it is in; -1 for defined data.
  int32 operand_index = 5;
  bool data = 6;
  // The instruction or data as the listing shows it.
  string text = 7;
  string label = 8;
  Address function = 9;
  string function_name = 10;
  bool wrapped = 11;
}

message SearchScalarsResponse {
  Snapshot snapshot = 1;
  repeated ScalarMatch matches = 2;
  uint64 rows_searched = 3;
  uint64 rows_total = 4;
  bool done = 5;
  bool truncated = 6;
  double elapsed_ms = 7;
}

message SearchDecompiledRequest {
  string program_id = 1;
  // revision 0 pins the head at the start of the call.
  ReadOptions read = 2;
  string query = 3;
  bool regex = 4;
  bool case_sensitive = 5;
  bool whole_word = 6;
  // The functions: these entries, or those whose entry is in `ranges`, or
  // with `all` every function.
  repeated Address functions = 7;
  repeated AddressRange ranges = 8;
  bool all = 9;
  // As DecompileManyRequest.parallelism.
  uint32 parallelism = 10;
  // Per function, as DecompileOptions.timeout_ms.
  uint32 timeout_ms = 11;
  // At most this many matching lines (0 = 1000; at most 100,000). The
  // search stops once it has them.
  uint32 max_results = 12;
}

message DecompiledMatch {
  // The function, as DecompileResponse names it.
  Address function = 1;
  string function_name = 2;
  // Index into DecompiledFunction.lines, its text (tokens joined, without
  // the indent) and the first match in it (UTF-8 byte offset and length).
  uint32 line = 3;
  string text = 4;
  uint32 match_start = 5;
  uint32 match_length = 6;
  // The line's address (CodeLine.address), if it has one.
  Address address = 7;
}

message SearchDecompiledResponse {
  Snapshot snapshot = 1;
  // In completion order: a function's matches together, by line.
  repeated DecompiledMatch matches = 2;
  // Progress: functions decompiled and searched, of all; and how many of
  // them failed to decompile (not searched).
  uint32 functions_done = 3;
  uint32 functions_total = 4;
  uint32 functions_failed = 5;
  bool done = 6;
  bool truncated = 7;
  double elapsed_ms = 8;
}

message FindTypeUsesRequest {
  string program_id = 1;
  // revision 0 pins the head at the start of the call.
  ReadOptions read = 2;
  // The struct or union, by type hash (GetTypes, FindTypes,
  // CodeToken.parent_type_hash).
  string type_hash = 3;
  // One field only: its byte offset in the type. Unset: every use of the
  // type (its fields and the type named in declarations and casts).
  optional uint64 field_offset = 4;
  // With field_offset, the field's name as the decompiler prints it, which
  // tells a union's members apart (all at offset 0). Empty: any name.
  string field_name = 5;
  // The functions: these entries, or those whose entry is in `ranges`, or
  // with `all` (or none of the three) every function.
  repeated Address functions = 6;
  repeated AddressRange ranges = 7;
  bool all = 8;
  // As DecompileManyRequest.parallelism.
  uint32 parallelism = 9;
  // Per function, as DecompileOptions.timeout_ms.
  uint32 timeout_ms = 10;
  // At most this many uses (0 = 1000; at most 100,000). The search stops
  // once it has them.
  uint32 max_results = 11;
}

enum TypeUseKind {
  TYPE_USE_KIND_UNSPECIFIED = 0;
  // A field of the type read, written or taken the address of (a FIELD
  // token whose parent is the type).
  TYPE_USE_KIND_FIELD = 1;
  // The type named: a variable's or parameter's declaration, a
  // prototype, a cast (a TYPE token naming it, pointers to it included).
  TYPE_USE_KIND_TYPE = 2;
}

// How a field use accesses the field, from the C statement it is in.
enum FieldAccess {
  // Not a field use, or not known.
  FIELD_ACCESS_UNSPECIFIED = 0;
  FIELD_ACCESS_READ = 1;
  // Assigned (`p->x = v`, a field of a field included: `p->x.y = v`
  // writes `x` too).
  FIELD_ACCESS_WRITE = 2;
  // Read and written: a compound assignment (`p->n += 1`), ++ or --.
  FIELD_ACCESS_READ_WRITE = 3;
  // Its address taken (`&p->x`), passed on as a pointer.
  FIELD_ACCESS_ADDRESS = 4;
}

message TypeUse {
  // The function, as DecompileResponse names it.
  Address function = 1;
  string function_name = 2;
  TypeUseKind kind = 3;
  FieldAccess access = 4;
  // The token's instruction address (CodeToken.address), if it has one;
  // else the line's (CodeLine.address).
  Address address = 5;
  // Index into DecompiledFunction.lines, its text (tokens joined, without
  // the indent) and the token's place in it (UTF-8 byte offset and length).
  uint32 line = 6;
  string text = 7;
  uint32 match_start = 8;
  uint32 match_length = 9;
  // FIELD uses: the field as printed and its offset in the type.
  string field_name = 10;
  optional uint64 field_offset = 11;
}

message FindTypeUsesResponse {
  Snapshot snapshot = 1;
  // In completion order: a function's uses together, by line.
  repeated TypeUse uses = 2;
  // Progress: functions decompiled and read, of all; and how many of them
  // failed to decompile (not read).
  uint32 functions_done = 3;
  uint32 functions_total = 4;
  uint32 functions_failed = 5;
  bool done = 6;
  bool truncated = 7;
  double elapsed_ms = 8;
}

message ListCallingConventionsRequest {
  string program_id = 1;
}

message CallingConvention {
  // The compiler spec's name: a <prototype> or <modelalias> ("__stdcall",
  // "__fastcall", "MSABI", "__thiscall").
  string name = 1;
  // The spec's <default_proto>.
  bool is_default = 2;
  // How a C declaration says it, which is how a prototype gets it (Retype
  // with a c_declaration): "__stdcall", "__attribute__((ms_abi))"; empty
  // when revkit's C parser has no spelling for it (the model can't be
  // chosen yet).
  string c_spelling = 3;
}

message ListCallingConventionsResponse {
  // By name; the default first.
  repeated CallingConvention conventions = 1;
  // The spec's default model's name ("__cdecl", "__stdcall").
  string default_name = 2;
}
